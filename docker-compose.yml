version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recursion-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the website folder to preserve the db.sqlite3 and allow hot-reloading
      - ./website:/app/website
    env_file:
      - ./website/.env
    environment:
      # Override the host-specific database path to the container path
      - DATABASE_URL=sqlite:////app/website/db.sqlite3
      - FRONTEND_BASE_URL=http://localhost:3000
    restart: always

  frontend:
    image: node:20-slim
    container_name: recursion-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ../RECursionNITD-Frontend:/app
    env_file:
      - ../RECursionNITD-Frontend/.env
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
    command: sh -c "npm config set fetch-retry-maxtimeout 600000 && npm config set fetch-retries 5 && npm config set fetch-retry-mintimeout 10000 && npm install --no-audit --no-fund && npm start"
    # Required for Create React App to stay alive in Docker
    stdin_open: true
    tty: true
    restart: always
    depends_on:
      - backend
